# Eastron register-map profiles, shared by every device that references them
# via `profile:` in the modbus_meter_eastron YAML config. Register layout is
# identical across all SDM72CT-M / SDM120M gateways (office/kompresorna/hangar) —
# see /opt/odoo/memory.ai/homeassistant--eastron.md for the source layout this
# was transcribed from (packages/power_meters/hangar/sensors/hangar_sensors_02.yaml
# and hangar_sensors_22.yaml).

sdm72ct_m:
  - {key: voltage_l1, register: 0, data_type: float32, unit_of_measurement: V, device_class: voltage, state_class: measurement}
  - {key: voltage_l2, register: 2, data_type: float32, unit_of_measurement: V, device_class: voltage, state_class: measurement}
  - {key: voltage_l3, register: 4, data_type: float32, unit_of_measurement: V, device_class: voltage, state_class: measurement}
  - {key: current_l1, register: 6, data_type: float32, unit_of_measurement: A, device_class: current, state_class: measurement}
  - {key: current_l2, register: 8, data_type: float32, unit_of_measurement: A, device_class: current, state_class: measurement}
  - {key: current_l3, register: 10, data_type: float32, unit_of_measurement: A, device_class: current, state_class: measurement}
  - {key: active_power_l1, register: 12, data_type: float32, unit_of_measurement: W, device_class: power, state_class: measurement}
  - {key: active_power_l2, register: 14, data_type: float32, unit_of_measurement: W, device_class: power, state_class: measurement}
  - {key: active_power_l3, register: 16, data_type: float32, unit_of_measurement: W, device_class: power, state_class: measurement}
  - {key: apparent_power_l1, register: 18, data_type: float32, unit_of_measurement: VA, state_class: measurement}
  - {key: apparent_power_l2, register: 20, data_type: float32, unit_of_measurement: VA, state_class: measurement}
  - {key: apparent_power_l3, register: 22, data_type: float32, unit_of_measurement: VA, state_class: measurement}
  - {key: reactive_power_l1, register: 24, data_type: float32, unit_of_measurement: VAr, state_class: measurement}
  - {key: reactive_power_l2, register: 26, data_type: float32, unit_of_measurement: VAr, state_class: measurement}
  - {key: reactive_power_l3, register: 28, data_type: float32, unit_of_measurement: VAr, state_class: measurement}
  - {key: power_factor_l1, register: 30, data_type: float32, state_class: measurement}
  - {key: power_factor_l2, register: 32, data_type: float32, state_class: measurement}
  - {key: power_factor_l3, register: 34, data_type: float32, state_class: measurement}
  - {key: total_active_power, register: 52, data_type: float32, unit_of_measurement: W, device_class: power, state_class: measurement}
  - {key: total_apparent_power, register: 56, data_type: float32, unit_of_measurement: VA, state_class: measurement}
  - {key: total_reactive_power, register: 60, data_type: float32, unit_of_measurement: VAr, state_class: measurement}
  - {key: total_power_factor, register: 62, data_type: float32, state_class: measurement}
  - {key: frequency, register: 70, data_type: float32, unit_of_measurement: Hz, device_class: frequency, state_class: measurement}
  - {key: import_active_energy, register: 72, data_type: float32, unit_of_measurement: kWh, device_class: energy, state_class: total_increasing}
  - {key: export_active_energy, register: 74, data_type: float32, unit_of_measurement: kWh, device_class: energy, state_class: total_increasing}
  - {key: import_reactive_energy, register: 76, data_type: float32, unit_of_measurement: kVArh, state_class: total_increasing}
  - {key: export_reactive_energy, register: 78, data_type: float32, unit_of_measurement: kVArh, state_class: total_increasing}
  - {key: total_system_power_demand, register: 84, data_type: float32, unit_of_measurement: W, device_class: power, state_class: measurement}
  - {key: max_system_power_demand, register: 86, data_type: float32, unit_of_measurement: W, state_class: measurement}
  - {key: import_system_power_demand, register: 88, data_type: float32, unit_of_measurement: W, state_class: measurement}
  - {key: max_import_system_power_demand, register: 90, data_type: float32, unit_of_measurement: W, state_class: measurement}
  - {key: export_system_power_demand, register: 92, data_type: float32, unit_of_measurement: W, state_class: measurement}
  - {key: max_export_system_power_demand, register: 94, data_type: float32, unit_of_measurement: W, state_class: measurement}
  - {key: max_current_demand, register: 264, data_type: float32, unit_of_measurement: A, state_class: measurement}
  - {key: total_active_energy, register: 342, data_type: float32, unit_of_measurement: kWh, device_class: energy, state_class: total_increasing}
  - {key: total_reactive_energy, register: 344, data_type: float32, unit_of_measurement: kVArh, state_class: total_increasing}
  - {key: serial_number, register: 64512, input_type: holding, data_type: uint32}

sdm120m:
  - {key: voltage, register: 0, data_type: float32, unit_of_measurement: V, device_class: voltage, state_class: measurement}
